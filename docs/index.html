<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写数字识别 · 在线演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7; color: #2c2c2a; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 32px 16px;
  }
  .card {
    background: #fff; border-radius: 14px; max-width: 760px; width: 100%;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 22px 24px;
  }
  h1 { font-size: 20px; font-weight: 600; }
  .sub { font-size: 13px; color: #888780; margin-top: 6px; line-height: 1.6; }
  .grid { display: flex; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
  .left, .right { flex: 1 1 280px; }
  #pad {
    width: 100%; aspect-ratio: 1; background: #fff; border: 1.5px solid #d3d1c7;
    border-radius: 10px; cursor: crosshair; touch-action: none;
  }
  .btns { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button {
    border: none; border-radius: 9px; padding: 10px 18px; font-size: 14px; cursor: pointer;
    background: #2c2c2a; color: #fff; transition: opacity .15s;
  }
  button.ghost { background: #f1efe8; color: #444441; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .result { min-height: 120px; }
  .big { font-size: 56px; font-weight: 600; line-height: 1.1; color: #2c2c2a; }
  .conf { font-size: 14px; color: #5f5e5a; margin-top: 4px; }
  .bars { margin-top: 14px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12.5px; }
  .bar-n { width: 12px; color: #444441; font-weight: 600; }
  .bar-track { flex: 1; height: 10px; background: #f1efe8; border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: #534ab7; border-radius: 5px; transition: width .25s; }
  .bar-top .bar-fill { background: #1d9e75; }
  .bar-v { width: 46px; text-align: right; color: #888780; font-variant-numeric: tabular-nums; }
  .status { font-size: 13px; color: #888780; margin-top: 10px; }
  .std-wrap { margin-top: 14px; display: none; }
  .std-wrap .cap { font-size: 12px; color: #888780; margin-bottom: 6px; }
  #std { image-rendering: pixelated; width: 84px; height: 84px; border: 1px solid #eee; background: #000; }
  footer { font-size: 12px; color: #888780; margin-top: 18px; line-height: 1.7; text-align: center; }
  a { color: #5f5e5a; }
</style>
</head>
<body>
<div class="card">
  <h1>手写数字识别</h1>
  <div class="sub">PCA 特征降维 + 神经网络（98.2% 准确率） · 推理在你的浏览器本地完成 ·
  在下方画板写一个 0~9 的数字，或点「载入样本」</div>

  <div class="grid">
    <div class="left">
      <canvas id="pad" width="280" height="280"></canvas>
      <div class="btns">
        <button id="btnRec" disabled>识别</button>
        <button id="btnSample" class="ghost" disabled>载入样本</button>
        <button id="btnClear" class="ghost">清空</button>
      </div>
      <div class="std-wrap" id="stdWrap">
        <div class="cap">模型实际接收的 28×28 输入（黑底白字，质心居中）</div>
        <canvas id="std" width="28" height="28"></canvas>
      </div>
    </div>

    <div class="right">
      <div class="result">
        <div class="big" id="big">–</div>
        <div class="conf" id="conf">等待输入…</div>
        <div class="bars" id="bars"></div>
        <div class="status" id="status">正在加载模型……</div>
      </div>
    </div>
  </div>
</div>

<footer>
  模型与实验细节见 <a href="https://github.com/yukhughkui/mnist-pca-ensemble" target="_blank">GitHub 仓库</a>
  · 链路：画板 → MNIST 标准化（反色/裁切/质心居中） → 标准化 → PCA 154 维 → MLP
</footer>

<script src="ort/ort.min.js"></script>
<script src="samples.js"></script>
<script>
const pad = document.getElementById('pad'), pctx = pad.getContext('2d');
const std = document.getElementById('std'), sctx = std.getContext('2d');
const big = document.getElementById('big'), conf = document.getElementById('conf');
const bars = document.getElementById('bars'), statusEl = document.getElementById('status');
const btnRec = document.getElementById('btnRec'), btnSample = document.getElementById('btnSample');
let session = null, drawing = false, lastPt = null;

ort.env.wasm.numThreads = 1;
ort.env.wasm.wasmPaths = new URL('ort/', location.href).href;
(async () => {
  try {
    session = await ort.InferenceSession.create('digit_mlp.onnx');
    statusEl.textContent = '模型就绪';
    btnRec.disabled = false; btnSample.disabled = false;
  } catch (e) { statusEl.textContent = '模型加载失败：' + e.message; }
})();

// ---------- 画板 ----------
function initPad() { pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, 280, 280); }
initPad();
function pos(e) {
  const r = pad.getBoundingClientRect();
  return [(e.clientX - r.left) * 280 / r.width, (e.clientY - r.top) * 280 / r.height];
}
pad.addEventListener('pointerdown', e => { drawing = true; lastPt = pos(e); });
pad.addEventListener('pointermove', e => {
  if (!drawing) return;
  const [x, y] = pos(e);
  pctx.strokeStyle = '#111'; pctx.lineWidth = 17; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.beginPath(); pctx.moveTo(...lastPt); pctx.lineTo(x, y); pctx.stroke();
  lastPt = [x, y];
});
window.addEventListener('pointerup', () => {
  if (drawing) { drawing = false; if (session) recognize(); }
});
document.getElementById('btnClear').onclick = () => {
  initPad(); big.textContent = '–'; conf.textContent = '等待输入…';
  bars.innerHTML = ''; document.getElementById('stdWrap').style.display = 'none';
};
btnSample.onclick = () => {
  const s = SAMPLES[Math.floor(Math.random() * SAMPLES.length)];
  const img = new Image();
  img.onload = () => {
    pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, 280, 280);
    pctx.imageSmoothingEnabled = false;
    pctx.drawImage(img, 0, 0, 280, 280);
    recognize();
  };
  img.src = s.img;
};
btnRec.onclick = () => session && recognize();

// ---------- 预处理：复刻 web_demo.preprocess_to_mnist ----------
const gk = (() => {   // σ=0.7 的一维高斯核（PIL GaussianBlur 等价）
  const s = 0.7, k = [];
  for (let i = -2; i <= 2; i++) k.push(Math.exp(-(i * i) / (2 * s * s)));
  const sum = k.reduce((a, b) => a + b);
  return k.map(v => v / sum);
})();

function gaussianBlur(a, w, h) {     // a: Float32Array h×w，输出同尺寸
  const t = new Float32Array(w * h), o = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let i = -2; i <= 2; i++) {
      const xx = Math.min(w - 1, Math.max(0, x + i));
      acc += a[y * w + xx] * gk[i + 2];
    }
    t[y * w + x] = acc;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let i = -2; i <= 2; i++) {
      const yy = Math.min(h - 1, Math.max(0, y + i));
      acc += t[yy * w + x] * gk[i + 2];
    }
    o[y * w + x] = acc;
  }
  return o;
}

function bilinear(src, sw, sh, dw, dh) {   // 单通道双线性缩放
  const out = new Float32Array(dw * dh);
  for (let y = 0; y < dh; y++) for (let x = 0; x < dw; x++) {
    const fx = (x + 0.5) * sw / dw - 0.5, fy = (y + 0.5) * sh / dh - 0.5;
    const x0 = Math.max(0, Math.floor(fx)), y0 = Math.max(0, Math.floor(fy));
    const x1 = Math.min(sw - 1, x0 + 1), y1 = Math.min(sh - 1, y0 + 1);
    const dx = fx - x0, dy = fy - y0;
    const v00 = src[y0 * sw + x0], v01 = src[y0 * sw + x1];
    const v10 = src[y1 * sw + x0], v11 = src[y1 * sw + x1];
    out[y * dw + x] = (v00 * (1 - dx) + v01 * dx) * (1 - dy) + (v10 * (1 - dx) + v11 * dx) * dy;
  }
  return out;
}

function preprocess() {   // 返回 Float32Array(784) 或 null
  const d = pctx.getImageData(0, 0, 280, 280).data;
  let arr = new Float32Array(280 * 280), mx = 0;
  for (let i = 0; i < 280 * 280; i++) {
    const L = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];  // PIL convert('L')
    const v = Math.min(255, Math.max(0, 255 - L));                    // 反色：黑底白字
    arr[i] = v; if (v > mx) mx = v;
  }
  if (mx < 5) return null;
  for (let i = 0; i < arr.length; i++) arr[i] /= mx;

  let x0 = 280, y0 = 280, x1 = -1, y1 = -1;   // 阈值 0.1 的包围盒
  for (let y = 0; y < 280; y++) for (let x = 0; x < 280; x++) {
    if (arr[y * 280 + x] > 0.1) {
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) return null;
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  const crop = new Float32Array(cw * ch);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) crop[y * cw + x] = arr[(y0 + y) * 280 + x0 + x];

  const scale = 20.0 / Math.max(cw, ch);
  const nw = Math.max(1, Math.round(cw * scale)), nh = Math.max(1, Math.round(ch * scale));
  const small = bilinear(crop, cw, ch, nw, nh);

  let sw = 0, scx = 0, scy = 0;               // 亮度加权质心
  for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) {
    const v = small[y * nw + x]; sw += v; scx += v * x; scy += v * y;
  }
  const cx = scx / sw, cy = scy / sw;
  const ox = Math.max(0, Math.min(28 - nw, Math.round(14 - cx)));
  const oy = Math.max(0, Math.min(28 - nh, Math.round(14 - cy)));

  let out = new Float32Array(28 * 28);
  for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) out[(oy + y) * 28 + ox + x] = small[y * nw + x];
  out = gaussianBlur(out, 28, 28);            // PIL GaussianBlur(0.7)
  return out;
}

// ---------- 推理 ----------
async function recognize() {
  const v = preprocess();
  if (!v) { conf.textContent = '画板是空的，先写个数字吧'; return; }
  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, 28, 28);
  const im = sctx.createImageData(28, 28);
  for (let i = 0; i < 784; i++) im.data[i*4] = im.data[i*4+1] = im.data[i*4+2] = Math.round(v[i] * 255), im.data[i*4+3] = 255;
  sctx.putImageData(im, 0, 0);
  document.getElementById('stdWrap').style.display = 'block';

  const out = await session.run({ X: new ort.Tensor('float32', v, [1, 784]) });
  const probs = Array.from(out[Object.keys(out).find(k => out[k].dims.length === 2)].data);
  const top = probs.indexOf(Math.max(...probs));
  big.textContent = top;
  conf.textContent = '置信度 ' + (probs[top] * 100).toFixed(1) + '%';
  const order = probs.map((p, i) => [i, p]).sort((a, b) => b[1] - a[1]).reverse();
  bars.innerHTML = probs.map((p, i) =>
    `<div class="bar-row${i === top ? ' bar-top' : ''}">
       <span class="bar-n">${i}</span>
       <span class="bar-track"><span class="bar-fill" style="width:${(p * 100).toFixed(1)}%"></span></span>
       <span class="bar-v">${(p * 100).toFixed(1)}%</span>
     </div>`).join('');
}
</script>
</body>
</html>
